<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>WEG HomeManager – Lokale Testversion</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#edf2f5;color:#163047;margin:0;min-height:100vh;display:grid;place-items:center}
    main{background:#fff;border-radius:22px;padding:35px;max-width:590px;margin:16px;box-shadow:0 16px 50px #16304717}
    img{max-width:100%;width:470px}p{line-height:1.6}a{color:#125c57}a.launch{background:#163047;color:#fff;border-radius:9px;display:inline-block;padding:12px 18px;text-decoration:none;font-weight:650}
    small{color:#596e7e}
  </style>
</head>
<body>
  <main>
    <img src="/weg-home-manager.svg" alt="WEG HomeManager"/>
    <h1>WEG HomeManager</h1>
    <p>Lokale Testversion zur Verwaltung von Wohnungseigentümergemeinschaften.
    Derzeit ausschließlich für synthetische Testdaten freigegeben.</p>
    <p><a class="launch" href="/de/login">Zur lokalen Anwendung</a></p>
    <small>Enthält Open-Source-Komponenten aus
    <a href="https://github.com/fgilde/hausverwaltung" rel="noopener noreferrer">HaVeWa</a>
    (AGPL-3.0). Es besteht keine Verbindung zum offiziellen HaVeWa-Angebot.</small>
  </main>

</html>
