name: HaVeWa integration baseline

on:
  push:
    branches:
      - integration/havewa-baseline
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package*.json'
      - 'vitest.config.ts'
      - '.github/workflows/integration-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Upstream Vitest
        run: npm test
      - name: Our isolated Node approval prototype
        run: node --test prototype/ai-case/engine.test.mjs
      - name: Production build (no live database)
        run: npm run build
      # Intentional: npm run lint is currently failing on inherited HaVeWa issues.
      # See docs/weg-homemanager/BASELINE_VERIFICATION.md; do not call this a lint-clean CI.
